version: '3.8'

services:
  # ========== Backend API ==========
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: healthcare-agent-api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/healthcare_agent_prod
      - REDIS_URL=redis://redis:6379/0

      # LLM Configuration
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-70b-instruct}
      - LLM_TIMEOUT=120

      # HelloNote EMR
      - HELLONOTE_BASE_URL=https://app.hellonote.com
      - HELLONOTE_USERNAME=${HELLONOTE_USERNAME}
      - HELLONOTE_PASSWORD=${HELLONOTE_PASSWORD}
      - HELLONOTE_API_KEY=${HELLONOTE_API_KEY}

      # Insurance Clearinghouse (Change Healthcare)
      - INSURANCE_PROVIDER=change_healthcare
      - INSURANCE_API_ENDPOINT=https://api.changehealthcare.com/medicalnetwork
      - INSURANCE_API_KEY=${CHANGE_HEALTHCARE_API_KEY}
      - INSURANCE_USERNAME=${CHANGE_HEALTHCARE_USERNAME}
      - INSURANCE_PASSWORD=${CHANGE_HEALTHCARE_PASSWORD}

      # Twilio SMS
      - ENABLE_SMS_REMINDERS=true
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}

      # SendGrid Email
      - ENABLE_EMAIL_REMINDERS=true
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Healthcare Agent}

      # Vector Database (Pinecone)
      - VECTOR_STORE=pinecone
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-west1-gcp}
      - PINECONE_INDEX_NAME=healthcare-cases
      - EMBEDDING_MODEL=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Security
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=1

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yourdomain.com}

      # Logging
      - LOG_LEVEL=INFO

      # Browser Automation
      - BROWSER_HEADLESS=true
      - ENABLE_VIDEO_RECORDING=true
      - ENABLE_PLAYWRIGHT_TRACING=true

    volumes:
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========== Celery Worker ==========
  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: healthcare-agent-celery
    restart: always
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/healthcare_agent_prod
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - HELLONOTE_USERNAME=${HELLONOTE_USERNAME}
      - HELLONOTE_PASSWORD=${HELLONOTE_PASSWORD}
      - INSURANCE_API_KEY=${CHANGE_HEALTHCARE_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "celery", "-A", "tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Celery Beat Scheduler ==========
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: healthcare-agent-celery-beat
    restart: always
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/healthcare_agent_prod
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ========== PostgreSQL Database ==========
  db:
    image: pgvector/pgvector:pg14
    container_name: healthcare-agent-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=healthcare_agent_prod
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: healthcare-agent-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Frontend (Production Build) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: healthcare-agent-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_BASE_URL=https://api.yourdomain.com
      - VITE_WS_BASE_URL=wss://api.yourdomain.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api

  # ========== Nginx Reverse Proxy ==========
  nginx:
    image: nginx:alpine
    container_name: healthcare-agent-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./data/logs/nginx:/var/log/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: healthcare-agent-network
